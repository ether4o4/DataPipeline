name: Data Pipeline Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'social_data_pipeline/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          base64 -d signing/datapipeline-release.keystore.b64 > signing/datapipeline-release.keystore
          test -s signing/datapipeline-release.keystore

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        shell: bash
        run: ./gradlew --version --no-daemon

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Data Pipeline Latest" --notes "Latest Android build from main."
          gh release upload "$TAG" "$APK#data-pipeline.apk" --clobber
